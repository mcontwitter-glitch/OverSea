name = "multisea-api"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Custom domain (multisea.io zone is on this Cloudflare account)
routes = [{ pattern = "api.multisea.io", custom_domain = true }]

# Create with: npx wrangler kv namespace create COLLECTIONS / NONCES, then paste the ids here.
kv_namespaces = [
  { binding = "COLLECTIONS", id = "fad2fd1bd7624356b252df2f38d16b28" },
  { binding = "NONCES", id = "512ac01fc76f43b08429aab9b040665a" },
]
# Create with: npx wrangler r2 bucket create multisea-media
# R2 not enabled on the account yet (error 10042). After enabling R2 in the dashboard:
#   npx wrangler r2 bucket create multisea-media  and uncomment:
# r2_buckets = [{ binding = "MEDIA", bucket_name = "multisea-media" }]

# Secret (never in code): npx wrangler secret put OPENSEA_API_KEY
[vars]
ALLOWED_ORIGINS = "https://multisea.io,https://www.multisea.io,https://mcontwitter-glitch.github.io"
SIWE_DOMAINS = "multisea.io,www.multisea.io,mcontwitter-glitch.github.io"
# LIL FOOTS deployer / owner() on Abstract
ADMIN_ADDRESSES = "0xca89ae48a5c61d13e78236daa4ac29ee588ea475"
STATIC_EDITORS = '{"lil-foots":["0xca89ae48a5c61d13e78236daa4ac29ee588ea475"]}'

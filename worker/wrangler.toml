name = "multisea-api"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Custom domain (multisea.io zone is on this Cloudflare account)
routes = [{ pattern = "api.multisea.io", custom_domain = true }]

# Create with: npx wrangler kv namespace create COLLECTIONS / NONCES, then paste the ids here.
kv_namespaces = [
  { binding = "COLLECTIONS", id = "fad2fd1bd7624356b252df2f38d16b28" },
  { binding = "NONCES", id = "512ac01fc76f43b08429aab9b040665a" },
]
# Media uploads (logos/banners) go to R2 bucket multisea-media.
r2_buckets = [{ binding = "MEDIA", bucket_name = "multisea-media" }]

# Secret (never in code): npx wrangler secret put OPENSEA_API_KEY
[vars]
# MultiSea fee wallet (Relay app-fee recipient); may view /admin Fees and claim.
FEE_WALLET = "0x25411039F77529A543344603bD8acdd65fABA4d0"
ALLOWED_ORIGINS = "https://multisea.io,https://www.multisea.io,https://mcontwitter-glitch.github.io"
SIWE_DOMAINS = "multisea.io,www.multisea.io,mcontwitter-glitch.github.io"
# LIL FOOTS deployer / owner() on Abstract
ADMIN_ADDRESSES = "0xca89ae48a5c61d13e78236daa4ac29ee588ea475"
STATIC_EDITORS = '{"lil-foots":["0xca89ae48a5c61d13e78236daa4ac29ee588ea475"]}'

# Re-validate MultiSea native listings (fills, cancels, transfers, expiry).
[triggers]
crons = ["*/15 * * * *"]

# ---- Growth features (referrals, revenue share, quests, bundles) ----
# Revenue-share payouts stay DISABLED until the payout wallet is funded. To enable later:
#   REVSHARE_PAYOUTS = "on"; REVSHARE_MAINNET = "on"; PAYOUT_WALLET = "0x…" (public address, for quotes)
#   npx wrangler secret put PAYOUT_KEY        # payout wallet private key (hot wallet; fund only what you intend to pay)
# Chain Voyager free mint (all 5 chain badges):
#   BADGE_CONTRACT = "0x…"; BADGE_CHAIN_ID = "8453"
#   npx wrangler secret put BADGE_SIGNER_KEY  # signs MintPass(to, deadline); must equal signer() on the contract
